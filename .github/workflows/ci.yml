name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend / unit tests + matcher-corpus gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Spotless (formatting)
        run: mvn -B spotless:check

      # Includes MatcherCorpusHarnessTest - false-merge = 0%, false-split <= 5% over
      # matcher-corpus/cases/*.json is a hard test failure here, not a separate report to read
      # later. No @Tag("integration") test runs in this job - no Docker needed for it.
      - name: Unit tests
        run: mvn -B test

      - name: JaCoCo coverage report
        run: mvn -B jacoco:report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/

  backend-integration:
    name: Backend / Testcontainers integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # GitHub-hosted ubuntu-latest runners ship Docker preinstalled and running - the one
      # environment difference from the sandbox this project was built in (see README).
      - name: Integration tests (real Postgres via Testcontainers)
        run: mvn -B verify -Pintegration

  frontend:
    name: Frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
